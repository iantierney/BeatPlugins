<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Floating Notepad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
    <style>
        :root {
            --background-color: #f5f5f5;
            --text-color: #333;
            font-size: 20px;
            --textarea-background-color: #F1F1F1;
            --footer-background-color: #F1F1F1;
            --footer-text-color: #787878;
            --selection-background-color: #b3d4fc;
            --selection-text-color: #000000;
            --scrollbar-background-color: #e0e0e0;
            --scrollbar-thumb-color: #b0b0b0;
            --highlight-color: #4a90e2;
            --highlight-color-other: #a0a0a0;
            --input-background-color: #ffffff;
            --input-text-color: #333333;
            --input-border-color: #cccccc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #222;
                --text-color: #d5d5d5;
                --textarea-background-color: #202022;
                --footer-background-color: #202022;
                --footer-text-color: #999;
                --selection-background-color: #4a90e2;
                --selection-text-color: #ffffff;
                --scrollbar-background-color: #333;
                --scrollbar-thumb-color: #555;
                --highlight-color: #4a90e2;
                --highlight-color-other: #707070;
                --input-background-color: #333333;
                --input-text-color: #d5d5d5;
                --input-border-color: #555555;
            }

            .CodeMirror {
                background-color: var(--textarea-background-color) !important;
                color: var(--text-color) !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            background-color: var(--footer-background-color);
            color: var(--footer-text-color);
            position: relative;
            gap: 10px;
        }

        .jump-nav {
            display: flex;
            align-items: center;
        }

        .jump-nav select {
            padding: 3px 6px;
            font-size: 0.85em;
            background-color: var(--input-background-color);
            color: var(--input-text-color);
            border: 1px solid var(--input-border-color);
            border-radius: 3px;
            max-width: 180px;
            cursor: pointer;
        }

        .search-bar {
            display: flex;
            align-items: center;
            padding: 2px;
            background-color: var(--footer-background-color);
            color: var(--footer-text-color);
            flex-grow: 1;
            max-width: 300px;
        }

        .search-bar input {
            margin-right: 5px;
            padding: 3px;
            font-size: 0.9em;
            flex-grow: 1;
            background-color: var(--input-background-color);
            color: var(--input-text-color);
            border: 1px solid var(--input-border-color);
            border-radius: 3px;
        }

        .search-bar button {
            padding: 3px;
            font-size: 0.9em;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--footer-text-color);
            display: flex;
            align-items: center;
            margin: -3px;
        }

        .search-bar button svg {
            width: 20px;
            height: 20px;
        }

        .search-bar .clear-search {
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 5px;
        }

        .font-size-controls {
            display: flex;
            align-items: center;
            padding: 2px;
        }

        .font-size-controls button {
            background: none;
            border: none;
            font-size: 1.4em;
            cursor: pointer;
            margin: 0 2px;
            color: var(--footer-text-color);
        }

        .footer-icon {
            position: absolute;
            right: 10px;
            bottom: 10px;
            top: auto;
            transform: translateY(0);
            font-size: 20px;
            font-weight: bold;
        }

        .footer:hover .footer-instructions {
            opacity: 1;
            visibility: visible;
        }

        .footer-instructions {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            margin-right: 30px;
        }

        .content {
            flex: 1;
            overflow: auto;
        }

        .CodeMirror {
            height: 100%;
            border: none;
            background-color: var(--textarea-background-color) !important;
            color: var(--text-color) !important;
        }

        .CodeMirror-scroll {
            height: 100% !important;
        }

        .CodeMirror-sizer {
            margin-bottom: 0 !important;
        }

        .CodeMirror-cursor {
            border-left-color: #0088F0 !important;
            border-left-width: 2px;
        }

        .CodeMirror-selected {
            background: var(--selection-background-color) !important;
        }

        .CodeMirror-selectedtext {
            color: var(--selection-text-color) !important;
        }

        ::selection {
            background: var(--selection-background-color);
            color: var(--selection-text-color);
        }

        .footer {
            background-color: var(--footer-background-color);
            color: var(--footer-text-color);
            padding: 4px 8px;
            font-size: 0.8em;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: right;
            height: 40px;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-background-color);
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb-color);
            border-radius: 5px;
            border: 2px solid var(--scrollbar-background-color);
        }

        .CodeMirror-line span.cm-formatting {
            display: none !important;
        }
        .CodeMirror-activeline .CodeMirror-line span.cm-formatting {
            display: inline !important;
        }

        .cm-header-1 { font-size: 1.75em; }
        .cm-header-2 { font-size: 1.50em; }
        .cm-header-3 { font-size: 1.25em; }
        .cm-header-4 { font-size: 1.15em; }
        .cm-header-5 { font-size: 1.0em; }

        .search-highlight-current {
            background-color: var(--highlight-color);
            color: var(--selection-text-color);
        }

        .search-highlight-other {
            background-color: var(--highlight-color-other);
            color: var(--selection-text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="jump-nav">
                <select id="headerSelect">
                    <option value="">Jump to heading...</option>
                </select>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Find...">
                <button id="findPrev">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                </button>
                <button id="findNext">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
                    </svg>
                </button>
                <span class="clear-search" id="clearSearch">×</span>
            </div>
            <div class="font-size-controls">
                <button id="increaseFontSize">+</button>
                <button id="decreaseFontSize">-</button>
            </div>
        </div>
        <div class="content">
            <textarea id="notepadTextarea"></textarea>
        </div>
        <div class="footer">
            <div class="footer-instructions">
                Open dropdown (⌘/). Jump sections (⌥↑/↓). Toggle window (⌥⌘3). Markdown markup shows only on active line.
            </div>
            <div class="footer-icon">
                ?
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/simplemde@1.11.2/dist/simplemde.min.js"></script>
    <script>
        let simplemde;
        let searchMatches = [];
        let currentMatchIndex = -1;
        let fontSize = 16;

        function initializeEditor(content) {
            simplemde = new SimpleMDE({
                element: document.getElementById("notepadTextarea"),
                initialValue: content,
                spellChecker: false,
                autosave: {
                    enabled: true,
                    uniqueId: "floating-notepad",
                    delay: 1000,
                },
                toolbar: false,
                status: false,
                previewRender: (plainText) => {
                    const modifiedText = plainText.replace(/^(#+)([^#\s])/gm, '$1 $2');
                    return this.parent.markdown(modifiedText);
                },
                parsingConfig: {
                    allowAtxHeaderWithoutSpace: true
                },
                codeMirror: {
                    mode: {
                        name: "gfm",
                        highlightFormatting: true,
                        underscoresBreakWords: false,
                        emoji: true,
                    },
                    inputStyle: "contenteditable"
                }
            });

            const cm = simplemde.codemirror;
            const inputField = cm.getInputField();
            if (inputField) {
                inputField.setAttribute("spellcheck", "true");
                inputField.setAttribute("autocorrect", "true");
                inputField.setAttribute("autocapitalize", "sentences");
            }

            let lastActiveLine = -1;
            cm.on("cursorActivity", () => {
                const currentLine = cm.getCursor().line;
                if (currentLine !== lastActiveLine) {
                    if (lastActiveLine >= 0 && lastActiveLine < cm.lineCount()) {
                        cm.removeLineClass(lastActiveLine, "wrap", "CodeMirror-activeline");
                    }
                    cm.addLineClass(currentLine, "wrap", "CodeMirror-activeline");
                    lastActiveLine = currentLine;
                }
            });
            cm.addLineClass(cm.getCursor().line, "wrap", "CodeMirror-activeline");

            cm.on("change", debounce(syncNotepadToMain, 500));

            document.getElementById('increaseFontSize').addEventListener('click', () => changeFontSize(2));
            document.getElementById('decreaseFontSize').addEventListener('click', () => changeFontSize(-2));
            document.getElementById('clearSearch').addEventListener('click', clearSearchInput);
            document.getElementById('headerSelect').addEventListener('change', jumpToSelectedHeader);

            updateHeaderDropdown();
        }

        function refreshNotepad() {
            Beat.callback(
                () => Beat.notepad.string,
                (text) => {
                    if (!simplemde) {
                        initializeEditor(text);
                    } else {
                        simplemde.value(text);
                    }
                    updateHeaderDropdown();
                }
            );
        }

        function syncNotepadToMain() {
            const content = simplemde.value();
            Beat.call(
                (arg) => Beat.custom.syncNotepad(arg),
                content
            );
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        function updateHeaderDropdown() {
            if (!simplemde) return;
            const cm = simplemde.codemirror;
            const select = document.getElementById('headerSelect');
            if (!select) return;

            const currentVal = select.value;
            select.innerHTML = '<option value="">Jump to heading...</option>';

            const headerRegex = /^(#{1,6})\s*(.+)$/;
            cm.eachLine((line) => {
                const match = line.text.match(headerRegex);
                if (match) {
                    const lineNum = cm.getLineNumber(line);
                    const hashes = match[1];
                    const title = match[2].trim();
                    const indent = "&nbsp;&nbsp;".repeat(hashes.length - 1);
                    
                    const opt = document.createElement('option');
                    opt.value = lineNum;
                    opt.innerHTML = indent + hashes + " " + title;
                    select.appendChild(opt);
                }
            });
            select.value = currentVal;
        }

        function jumpToSelectedHeader() {
            const select = document.getElementById('headerSelect');
            const lineNum = parseInt(select.value, 10);
            if (!isNaN(lineNum) && simplemde) {
                const cm = simplemde.codemirror;
                cm.setCursor({ line: lineNum, ch: 0 });
                cm.scrollIntoView({ line: lineNum, ch: 0 }, 100);
                cm.focus();
            }
        }

        window.addEventListener('load', refreshNotepad);
        window.addEventListener("focus", refreshNotepad);
        refreshNotepad();

        document.getElementById('searchInput').addEventListener('input', performSearch);
        document.getElementById('findPrev').addEventListener('click', () => navigateSearchResults(-1));
        document.getElementById('findNext').addEventListener('click', () => navigateSearchResults(1));

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            searchMatches = [];
            currentMatchIndex = -1;

            if (query) {
                const cm = simplemde.codemirror;
                const regex = new RegExp(query, 'gi');
                cm.eachLine((line) => {
                    let match;
                    while ((match = regex.exec(line.text)) !== null) {
                        searchMatches.push({ line: cm.getLineNumber(line), ch: match.index });
                    }
                });
                highlightMatches();
                navigateSearchResults(1);
            } else {
                clearHighlights();
            }
        }

        function highlightMatches() {
            clearHighlights();
            const cm = simplemde.codemirror;
            searchMatches.forEach((match, index) => {
                cm.markText(
                    { line: match.line, ch: match.ch },
                    { line: match.line, ch: match.ch + document.getElementById('searchInput').value.length },
                    { className: index === currentMatchIndex ? 'search-highlight-current' : 'search-highlight-other' }
                );
            });
        }

        function clearHighlights() {
            const cm = simplemde.codemirror;
            cm.getAllMarks().forEach(mark => mark.clear());
        }

        function navigateSearchResults(direction) {
            if (searchMatches.length === 0) return;

            currentMatchIndex = (currentMatchIndex + direction + searchMatches.length) % searchMatches.length;
            const match = searchMatches[currentMatchIndex];
            const cm = simplemde.codemirror;
            cm.setCursor({ line: match.line, ch: match.ch });
            cm.scrollIntoView({ line: match.line, ch: match.ch });
            highlightMatches();
        }

        function changeFontSize(delta) {
            fontSize += delta;
            document.querySelector('.CodeMirror').style.fontSize = fontSize + 'px';
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            clearHighlights();
        }

        function jumpRelative(direction) {
            if (!simplemde) return;
            const cm = simplemde.codemirror;
            const currentLine = cm.getCursor().line;
            const headerRegex = /^(#{1,6})\s*(.+)$/;
            const headerLines = [];

            cm.eachLine((line) => {
                if (headerRegex.test(line.text)) {
                    headerLines.push(cm.getLineNumber(line));
                }
            });

            if (headerLines.length === 0) return;

            let targetLine = headerLines[0];
            if (direction > 0) {
                const next = headerLines.find(l => l > currentLine);
                targetLine = next !== undefined ? next : headerLines[0];
            } else {
                const prev = [...headerLines].reverse().find(l => l < currentLine);
                targetLine = prev !== undefined ? prev : headerLines[headerLines.length - 1];
            }

            cm.setCursor({ line: targetLine, ch: 0 });
            cm.scrollIntoView({ line: targetLine, ch: 0 }, 100);
            cm.focus();
        }

        // Handle global shortcuts
        window.addEventListener('keydown', (e) => {
            // Opt + Up/Down for relative heading navigation
            if (e.altKey && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    jumpRelative(1);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    jumpRelative(-1);
                }
            }

            // Cmd + / to focus and expand/open the header dropdown menu
            if (e.metaKey && e.key === '/') {
                e.preventDefault();
                const selectElement = document.getElementById('headerSelect');
                if (selectElement) {
                    selectElement.focus();
                    if (typeof selectElement.showPicker === 'function') {
                        selectElement.showPicker();
                    } else {
                        const event = new MouseEvent('mousedown', {
                            bubbles: true,
                            cancelable: true,
                            view: window
                        });
                        selectElement.dispatchEvent(event);
                    }
                }
            }
        });
    </script>
</body>
</html>
